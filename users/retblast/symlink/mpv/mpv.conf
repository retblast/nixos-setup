# Save position on quit
save-position-on-quit=yes

# Video
vo=dmabuf-wayland
hwdec=yes
hwdec-codecs=all
gpu-context=auto
gpu-api=vulkan

# Scaling and Performance
vf=scale_vaapi=mode=hq:force_original_aspect_ratio=decrease:format=p010
deinterlace=no
scale=bilinear
dscale=bilinear
correct-downscaling=no
sigmoid-upscaling=no

# Interpolation
tscale=oversample
interpolation=yes
opengl-pbo=yes

# Dithering and Debanding
dither-depth=auto
dither=fruit
deband=no
deband-iterations=2
deband-threshold=24
deband-range=8
deband-grain=24

# Vulkan Specifics
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1

# Colors and HDR
gamut-mapping-mode=saturation
libplacebo-opts-append=gamut_expansion=yes
target-colorspace-hint=yes
tone-mapping=hable
hdr-compute-peak=auto
hdr-contrast-recovery=0.5

# Audio
replaygain=album
gapless-audio=yes
audio-normalize-downmix=yes

# Subtitles
sub-auto=fuzzy
sub-bold=yes
sub-font=system-ui

# Screenshots
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes
screenshot-jpeg-quality=100
screenshot-template="%F-%P"

# Interface
term-osd-bar=yes
osd-fractions=
image-display-duration=5
osd-font-size=30
osd-font=system-uia

# Cache
cache=yes
cache-secs=120

# yt-dlp
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
ytdl-raw-options=no-sponsorblock=,downloader=aria2c,downloader-args=aria2c:'-x 10'
